name: Deploy Apps Script

# push to main        -> deploy the version already in the files (NO auto-bump)
# manual "Run workflow" -> optionally bump first, then deploy
#
# Deploy = clasp push (make the live project match apps-script/) + a new script
# version + update the ONE existing deployment in place. The deployment ID is
# reused on purpose: a new deployment would mint a new /exec URL and break the
# link hardcoded in the landing page.
#
# Secrets (set on the repo):
#   CLASPRC_JSON  - contents of your local ~/.clasprc.json
#   SCRIPT_ID     - Apps Script project ID
#   DEPLOYMENT_ID - the deployment the web app URL points at

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump before deploy'
        required: true
        default: 'none'
        type: choice
        options: [none, minor, major]
      note:
        description: 'CHANGELOG note (only used when bumping)'
        required: false
        default: ''

concurrency:
  group: deploy-apps-script
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Write clasp credentials
        env: { CLASPRC_JSON: "${{ secrets.CLASPRC_JSON }}" }
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::CLASPRC_JSON secret is empty."; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME+'/.clasprc.json','utf8'))" \
            || { echo "::error::CLASPRC_JSON is not valid JSON."; exit 1; }
          chmod 600 "$HOME/.clasprc.json"

      - name: Write .clasp.json
        env: { SCRIPT_ID: "${{ secrets.SCRIPT_ID }}" }
        run: |
          if [ -z "$SCRIPT_ID" ]; then echo "::error::SCRIPT_ID secret is empty."; exit 1; fi
          printf '{ "scriptId": "%s", "rootDir": "apps-script" }\n' "$SCRIPT_ID" > .clasp.json

      - name: Guard — project is complete
        # clasp push --force makes the live project match this folder, so every
        # file the app references must be here or it would be deleted remotely.
        run: |
          for f in appsscript.json Code.gs Index.html Denied.html Logos.html; do
            if [ ! -f "apps-script/$f" ]; then
              echo "::error::apps-script/$f is missing — refusing to deploy an incomplete project."; exit 1
            fi
          done
          echo "All required project files present."

      - name: Optional version bump (manual runs only)
        id: bump
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump != 'none' }}
        env: { IN_BUMP: "${{ github.event.inputs.bump }}", IN_NOTE: "${{ github.event.inputs.note }}" }
        run: |
          NOTE="$IN_NOTE"; [ -z "$NOTE" ] && NOTE="Manual deploy"
          node tools/bump-version.js --"$IN_BUMP" --note "$NOTE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md apps-script index.html 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "chore: release v$(cat VERSION) [skip ci]"; git push; }

      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Push code to Apps Script
        run: clasp push --force

      - name: Create a new script version
        id: scriptver
        env: { V: "${{ steps.ver.outputs.version }}", SHA: "${{ github.sha }}" }
        run: |
          OUT=$(clasp version "v$V — $SHA"); echo "$OUT"
          NUM=$(echo "$OUT" | grep -oE '[0-9]+' | tail -1)
          [ -z "$NUM" ] && { echo "::error::Could not read new version number."; exit 1; }
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Update the existing deployment
        env: { DEPLOYMENT_ID: "${{ secrets.DEPLOYMENT_ID }}" }
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "::error::DEPLOYMENT_ID empty — refusing (a new deployment would change the URL)."; exit 1
          fi
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --versionNumber "${{ steps.scriptver.outputs.number }}" --description "v${{ steps.ver.outputs.version }}"

      - name: Summary
        run: |
          {
            echo "### Deployed v${{ steps.ver.outputs.version }}"
            echo "| Item | Value |"; echo "| --- | --- |"
            echo "| App version | ${{ steps.ver.outputs.version }} |"
            echo "| Apps Script version | ${{ steps.scriptver.outputs.number }} |"
            echo "| Deployment | updated in place (URL unchanged) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
